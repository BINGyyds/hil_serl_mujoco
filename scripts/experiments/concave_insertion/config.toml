# Concave insertion task configuration (sparse reward, no camera by default)

[env]
# Robot server URL
server_url = "http://127.0.0.2:5000/"

# Whether to show image windows (dummy camera still produces images)
display_image = false

# Episode length and random reset
max_episode_length = 100
random_reset = true
random_xy_range = 0.01
random_rz_range = 0.03

# Action scaling: [xyz_delta_scale, rotvec_delta_scale, gripper_scale]
action_scale = [0.005, 0.05, 1.0]

# Target pose (xyz + rpy in radians)
# Update these for your setup
# Example values below are placeholders

target_pose = [0.55, 0.00, 0.25, 3.14159, 0.0, 0.0]

# Sparse reward threshold (xyz + rpy)
reward_threshold = [0.005, 0.005, 0.005, 0.02, 0.02, 0.02]

# Optional reset pose (xyz + rpy). If omitted, target_pose + [0,0,0.05,0,0,0] is used
# reset_pose = [0.55, 0.00, 0.30, 3.14159, 0.0, 0.0]

# Safety limits (xyz + rpy). If omitted, a default box around target_pose is used
# abs_pose_limit_low = [0.52, -0.03, 0.22, 3.04159, -0.1, -0.4]
# abs_pose_limit_high = [0.58, 0.03, 0.32, 3.24159, 0.1, 0.4]

[realsense]
# Use a dummy camera so the pipeline runs without RealSense
use_dummy = true

[compliance]
translational_stiffness = 2000
translational_damping = 89
rotational_stiffness = 150
rotational_damping = 7
translational_Ki = 0
translational_clip_x = 0.0075
translational_clip_y = 0.0016
translational_clip_z = 0.0055
translational_clip_neg_x = 0.002
translational_clip_neg_y = 0.0016
translational_clip_neg_z = 0.005
rotational_clip_x = 0.01
rotational_clip_y = 0.025
rotational_clip_z = 0.005
rotational_clip_neg_x = 0.01
rotational_clip_neg_y = 0.025
rotational_clip_neg_z = 0.005
rotational_Ki = 0

[precision]
translational_stiffness = 2000
translational_damping = 89
rotational_stiffness = 250
rotational_damping = 9
translational_Ki = 0.0
translational_clip_x = 0.1
translational_clip_y = 0.1
translational_clip_z = 0.1
translational_clip_neg_x = 0.1
translational_clip_neg_y = 0.1
translational_clip_neg_z = 0.1
rotational_clip_x = 0.5
rotational_clip_y = 0.5
rotational_clip_z = 0.5
rotational_clip_neg_x = 0.5
rotational_clip_neg_y = 0.5
rotational_clip_neg_z = 0.5
rotational_Ki = 0.0
